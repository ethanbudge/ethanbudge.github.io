---
layout: default
---
<div class="page-shell page-shell--with-sidebar">
  <article class="page-shell__main">
    <div class="post-header">
      {% if page.section_title %}
      <div class="post-header__section">
        <a href="/{{ page.section }}/">{{ page.section_title }}</a>
      </div>
      {% endif %}
      <h1>{{ page.title }}</h1>
      <div class="post-header__meta">{{ page.date | date: "%B %-d, %Y" }}</div>
    </div>
    {{ content }}
  </article>
  {% include sidebar.html %}
</div>
